[workspace]
resolver = "2"
members = ["common", "launch", "factory", "integration-tests"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/Oluwatimothy/orbit"

[workspace.dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"
orbit-common = { path = "common" }
uint = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
