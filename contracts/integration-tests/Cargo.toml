[package]
name = "orbit-integration-tests"
description = "Sandbox tests that run the compiled Orbit contracts together"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
anyhow = "1"
near-workspaces = "=0.24.0"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bs58 = "0.5"

[lib]
path = "lib.rs"
